<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Holdfast Strength</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
/* Layout: a phone app with one committed look. A deep plum "stage" holds the member's week and score; the brand gradient is reserved for the one thing to do next. */
:root{
  color-scheme:light;
  --bg:#FBF3F7; --surface:#FFFFFF; --sunk:#F1E4EE; --ink:#24102F; --muted:#75627E; --line:#E8D9E6;
  --plum:#2A1038; --plum2:#4A1A60; --on-plum:#FFFFFF; --on-plum-soft:#D9C3E3;
  --berry:#C81A60; --coral:#FF6B5E; --violet:#7A1FA2; --sun:#FFC23C; --mint:#12957B; --mint-soft:#D5F1EA;
  --lilac:#7C68B5; --lilac-soft:#E8E2F6; --amber:#B56A00; --amber-soft:#FDEBC6; --berry-soft:#FCE0EB;
  --stop:#A32222; --stop-soft:#F9DEDC;
  --grad:var(--berry);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.08}
h2{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h3{font-size:1.15rem;font-weight:800}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center}
.mark::after{content:"";width:12px;height:4px;border-radius:2px;background:var(--surface);box-shadow:0 -6px 0 var(--surface),0 6px 0 var(--surface)}
.link{background:none;border:0;color:var(--berry);font:600 .95rem var(--body);cursor:pointer;padding:8px 4px;text-decoration:underline}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 var(--line)}
.btn{background:var(--grad);color:#FFFFFF;border:0;border-radius:999px;padding:15px 22px;font:700 1.05rem var(--body);cursor:pointer;text-align:center}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.btn.white{background:var(--surface);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1 1 140px}

/* stage */
.stage{background:var(--plum);color:var(--on-plum);border-radius:26px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.stage .soft{color:var(--on-plum-soft)}
.stagehead{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.stagehead div{min-width:0}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.75rem;font-weight:700;background:var(--sun);color:var(--plum)}
.ring{position:relative;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.25rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border-radius:13px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center;min-width:0;background:rgba(255,255,255,.09);border:2px solid transparent}
.day b{font-size:.7rem;font-weight:600;color:var(--on-plum-soft)}
.day span{font-size:.72rem;font-weight:700}
.day i{width:10px;height:10px;border-radius:50%}
.day.strength i{background:var(--coral)} .day.walk i{background:#5FE0C2} .day.easy i{background:#B9A8EE} .day.jab i{background:var(--sun)}
.day.today{border-color:var(--sun)}
.day.done i{background:var(--sun);box-shadow:0 0 0 3px rgba(255,194,60,.3)}

/* hero + today */
.hero{background:var(--grad);color:#FFFFFF;border-radius:26px;padding:26px 20px;display:flex;flex-direction:column;gap:14px}
.hero h2{font-size:2.5rem}
.todaycard{border-radius:26px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.todaycard.strength{background:var(--grad);color:#FFFFFF}
.todaycard.walk{background:var(--mint-soft)} .todaycard.easy{background:var(--lilac-soft)} .todaycard.jab{background:var(--amber-soft)}
.note{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--amber-soft)}
.note.stop{background:var(--stop-soft)}
.insight{background:var(--plum);color:var(--on-plum);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px}
.insight .eyebrow{color:var(--sun)}

/* pillars, standards */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pillar{background:var(--surface);border-radius:18px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.pillar b{font-family:var(--display);font-size:1.05rem}
.glyph{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#FFFFFF}
.g1{background:var(--berry)} .g2{background:var(--mint)} .g3{background:var(--violet)}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ticks li{display:grid;grid-template-columns:24px 1fr;gap:10px}
.ticks li::before{content:"✓";width:24px;height:24px;border-radius:50%;background:var(--mint-soft);color:var(--mint);display:grid;place-items:center;font-weight:800;font-size:.8rem}

/* video slot */
.video{aspect-ratio:16/9;max-width:100%;border-radius:20px;background:var(--plum2);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px}
.video.thumb{aspect-ratio:1;width:76px;border-radius:16px;padding:0}
.play{width:54px;height:54px;border-radius:50%;background:var(--sun);display:grid;place-items:center}
.thumb .play{width:34px;height:34px}
.play::after{content:"";border-left:16px solid var(--plum);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.thumb .play::after{border-left-width:10px;border-top-width:6px;border-bottom-width:6px}
.video small{opacity:.8}

/* inputs */
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:700;padding:0;margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 16px;font:600 .95rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--plum);color:#FFFFFF;border-color:var(--plum)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 12px;font:600 .95rem var(--body);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile small{font-weight:500;color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--berry);background:var(--berry-soft)}
input[type=text]{font:600 1.1rem var(--body);padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.dots{display:flex;gap:8px}
.dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--mint);background:none;color:var(--mint);font:700 1rem var(--body);cursor:pointer}
.dot.on{background:var(--mint);color:#FFFFFF}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--berry)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 1.3rem var(--body);cursor:pointer}
.stepper b{font-family:var(--display);font-size:1.6rem;min-width:4.5rem;text-align:center;font-variant-numeric:tabular-nums}

/* progress bits */
.bar{display:grid;gap:4px;height:10px}
.bar i{border-radius:5px;background:var(--sunk)} .bar i.on{background:var(--berry)}
.dose{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:18px;padding:12px}
.stat b{font-family:var(--display);font-size:1.7rem;display:block;font-variant-numeric:tabular-nums}
.tests{display:flex;gap:10px;align-items:flex-end;height:90px}
.tests div{flex:1 1 0;max-width:56px;border-radius:10px 10px 4px 4px;background:var(--grad);display:flex;align-items:flex-start;justify-content:center;color:#FFFFFF;font-weight:700;font-size:.85rem;padding-top:4px;min-height:26px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border-radius:16px;padding:12px 6px;text-align:center;background:var(--sunk);color:var(--muted);font-size:.78rem;font-weight:600;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.badge i{width:40px;height:40px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;color:var(--muted)}
.badge.won{background:var(--amber-soft);color:var(--ink)} .badge.won i{background:var(--sun);color:var(--plum)}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.phase{border-radius:14px;padding:10px;background:var(--sunk);min-width:0}
.phase.now{background:var(--plum);color:#FFFFFF}
.phase b{display:block;font-family:var(--display)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:3rem 1fr;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item div,.lesson div{min-width:0}
.lesson{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700}
.tag.strength{background:var(--berry-soft);color:var(--berry)} .tag.walk{background:var(--mint-soft);color:var(--mint)}
.tag.easy{background:var(--lilac-soft);color:var(--lilac)} .tag.jab{background:var(--amber-soft);color:var(--amber)}
ul{margin:0;padding-left:20px}
details summary{cursor:pointer;font-weight:700}

#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
#tabs[hidden]{display:none}
#tabs div{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:520px}
#tabs button{background:none;border:0;color:var(--muted);font:600 .78rem var(--body);padding:6px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="true"]{color:var(--berry);background:var(--berry-soft)}
footer{font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header id="hd"></header>
  <main id="app" class="stack"></main>
  <footer>Holdfast gives exercise guidance only. It does not give advice about your medication, dose or diagnosis. Speak to your prescriber, pharmacist or GP about those.</footer>
</div>
<nav id="tabs" aria-label="Sections" hidden><div>
  <button data-go="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-go="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>My plan</button>
  <button data-go="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button data-go="learn"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21a2 2 0 0 0 2 2h13"/></svg>Learn</button>
</div></nav>

<script>
/* ---------- programme logic (pure) ---------- */
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const STAGES=[[2,8],[2,10],[2,12],[3,8],[3,10],[3,12]];
const START={new:0,some:1,regular:3};
const ORDER=['gym','dumbbells','kettlebell','bands','none'];
const KIT={none:['Just my bodyweight','A chair and a stair'],bands:['Resistance bands','Loop or tube'],dumbbells:['Dumbbells','Any weight'],kettlebell:['Kettlebell','One is enough'],bench:['Bench or step','Sturdy and stable'],gym:['Gym membership','Machines and weights']};
/* [name, cue, flags]  h = timed hold, l = load can be logged */
const LIB={
 squat:{gym:['Leg press','Feet hip width. Lower until knees reach 90 degrees.','l'],dumbbells:['Goblet squat','One dumbbell at your chest. Sit between your hips.','l'],kettlebell:['Kettlebell goblet squat','Hold the bell by the horns at your chest.','l'],bands:['Band squat','Stand on the band, handles at shoulders.',''],none:['Sit to stand','From a chair, no hands. Lower for 3 seconds.','']},
 push:{gym:['Chest press machine','Handles level with mid chest. Press without locking out.','l'],dumbbells:['Floor press','Lie on the floor. Elbows touch down softly.','l'],kettlebell:['Kettlebell floor press','One arm at a time. Wrist straight.','l'],bands:['Band chest press','Band anchored behind you at chest height.',''],none:['Incline press-up','Hands on a worktop. Body in one straight line.','']},
 pull:{gym:['Seated row machine','Sit tall. Pull elbows past your ribs.','l'],dumbbells:['One-arm row','Hand on a chair. Pull to your hip.','l'],kettlebell:['Kettlebell row','Hand on a chair. Pull the bell to your hip.','l'],bands:['Band row','Anchor at waist height. Elbows brush your ribs.',''],none:['Loaded bag row','One hand on a chair. Pull a filled bag to your hip.','']},
 core:{bands:['Pallof press','Band to your side. Press out and resist the twist.','h'],none:['Dead bug','Lower back stays on the floor. Opposite arm and leg.','h']},
 hinge:{gym:['Dumbbell Romanian deadlift','Soft knees. Weights slide down your thighs.','l'],dumbbells:['Romanian deadlift','Soft knees. Dumbbells slide down your thighs.','l'],kettlebell:['Kettlebell deadlift','Bell between your feet. Push the floor away.','l'],bands:['Band deadlift','Stand on the band. Hinge at the hips, back long.',''],none:['Glute bridge','Pause for 2 seconds at the top.','']},
 lunge:{gym:['Split squat','Hold a rail if you need balance.','l'],dumbbells:['Split squat','Hold a chair if you need balance.','l'],kettlebell:['Kettlebell step-up','Bell at your chest. Push through the whole foot.','l'],bands:['Banded side step','Band above knees. Small steps, hips level.',''],none:['Step-up','Bottom stair. Push through the whole foot.','']},
 press:{gym:['Shoulder press machine','Press up without shrugging.','l'],dumbbells:['Overhead press','Seated if standing feels wobbly.','l'],kettlebell:['Kettlebell press','One arm. Ribs down, squeeze your glutes.','l'],bands:['Band overhead press','Stand on the band. Press straight up.',''],none:['Bag press overhead','Filled bag or two water bottles. Ribs down.','']},
 carry:{gym:['Suitcase carry','One heavy dumbbell. Walk tall. Swap sides.','hl'],dumbbells:['Suitcase carry','One heavy dumbbell. Walk tall. Swap sides.','hl'],kettlebell:['Kettlebell carry','Bell in one hand. Walk tall. Swap sides.','hl'],bands:['Band pull-apart','Arms straight, squeeze shoulder blades.',''],none:['Suitcase hold','Heavy bag in one hand. Stand tall. Swap sides.','h']}
};
/* gentler swaps when a member flags an area to look after */
const ALT={squat:['knees',['Sit to stand, high seat','Use a higher chair or add a cushion. Slow and steady.','']],lunge:['knees',['Glute bridge march','Hips up, lift one foot at a time.','']],hinge:['back',['Glute bridge','Pause for 2 seconds at the top.','']],press:['shoulders',['Wall slide','Back to the wall. Slide arms up as far as is comfortable.','']]};
function pick(slot,p){
  const a=ALT[slot]; if(a&&(p.care||[]).includes(a[0])) return a[1];
  if(slot==='push'&&p.equip.includes('dumbbells')&&p.equip.includes('bench')&&!p.equip.includes('gym')) return ['Dumbbell bench press','Feet flat on the floor. Lower to chest height.','l'];
  for(const k of ORDER) if((k==='none'||p.equip.includes(k))&&LIB[slot][k]) return LIB[slot][k];
}
function sessionList(p,which){
  let s=which==='A'?['squat','push','pull','core']:['hinge','lunge','press','carry'];
  if(p.len===15) s=s.slice(0,3); if(p.len===35) s=s.concat(which==='A'?'carry':'core');
  return s.map(k=>pick(k,p));
}
function dayPlan(p,dow){
  const off=(dow-p.jab+7)%7;
  if(off===0) return {type:'jab',short:'Jab',title:'Injection day',text:'No strength today. If you feel up to it, take an easy 10 to 20 minute walk.'};
  const map=p.sessions===3?{2:'A',4:'B',6:'A'}:{3:'A',6:'B'};
  if(map[off]) return {type:'strength',short:'Lift',title:'Strength session '+map[off],session:map[off]};
  if(off===1) return {type:'easy',short:'Rest',title:'Rest day',text:'The day after your injection is for rest. Eat what you can and keep sipping water.'};
  return {type:'walk',short:'Walk',title:'Walk day',text:'Walk for 20 to 30 minutes at a pace where you can still chat.'};
}
function dose(stage,light,flags){
  let [s,r]=STAGES[stage]; if(light) s=Math.max(1,s-1);
  return (flags||'').includes('h')? s+' × '+(r*3)+' sec' : s+' × '+r;
}
function shouldDrop(log){ return !!log && (log.eaten==='no' || (log.energy>0 && log.energy<=2)); }
function review(p,logs,dates){
  let done=0,easy=0,right=0,hard=0,fed=0;
  dates.forEach(d=>{const l=logs[d]; if(!l) return;
    if(l.finished){done++; if(l.felt==='easy')easy++; else if(l.felt==='hard')hard++; else right++;}
    if(l.eaten==='yes'||(l.protein||0)>=3) fed++; });
  let move=0,why;
  if(done===0){why='No sessions logged this week. Next week stays the same. One session is a win.';}
  else if(hard>right+easy){move=-1;why='Most sessions felt too hard. Next week drops back a step so you can finish strong.';}
  else if(done<p.sessions){why='You did '+done+' of '+p.sessions+'. Next week stays the same so you can hit them all.';}
  else if(fed<4){why='You trained well but ate enough on only '+fed+' days. Hold here until food catches up. Muscle needs fuel.';}
  else {move=1;why='Every session done and it felt manageable. Next week steps up.';}
  const next=Math.max(0,Math.min(STAGES.length-1,p.stage+move));
  return {done,easy,right,hard,fed,move:next-p.stage,next,why};
}
/* ---------- end pure logic ---------- */

const KEY='holdfast-v3';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const parse=s=>{const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);};
const monday=d=>iso(addDays(d,-((d.getDay()+6)%7)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NOW=new Date(), TODAY=iso(NOW);
const blank=()=>({profile:null,logs:{},draft:{},tests:[],loads:{}});
function example(){
  const p={name:'Sam',jab:(NOW.getDay()+5)%7,sessions:3,len:25,equip:['dumbbells','bands'],care:[],goal:'muscle',level:'some',stage:1,start:iso(addDays(NOW,-16)),example:true};
  const logs={};
  for(let i=1;i<=16;i++){const d=addDays(NOW,-i),pl=dayPlan(p,d.getDay());
    logs[iso(d)]={eaten:i%5===3?'bit':'yes',protein:i%5===3?2:3,energy:4,finished:pl.type==='strength',felt:'right'};}
  return {profile:p,logs,draft:{},tests:[{d:iso(addDays(NOW,-16)),n:11},{d:iso(addDays(NOW,-2)),n:13}],loads:{'Goblet squat':8,'Floor press':6,'One-arm row':8}};
}
let S; try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!S||typeof S!=='object') S=blank();
['logs','draft','loads'].forEach(k=>{if(!S[k])S[k]={};}); if(!S.tests)S.tests=[];
if(location.hash==='#example') S=example();
function save(){ if(S.profile&&S.profile.example) return; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function log(){return S.logs[TODAY]||(S.logs[TODAY]={});}
let view=S.profile?'today':'welcome', step=0, msg='', T={left:30,count:0,state:'idle'}, timer=null;

const app=document.getElementById('app'), hd=document.getElementById('hd'), tabs=document.getElementById('tabs');
const on=(cur,val)=>Array.isArray(cur)?cur.includes(val):String(cur)===String(val);
const chip=(act,val,cur,text)=>`<button class="chip" data-act="${act}" data-val="${val}" aria-pressed="${on(cur,val)}">${text}</button>`;
const tile=(act,val,cur,text,sub)=>`<button class="tile" data-act="${act}" data-val="${val}" aria-pressed="${on(cur,val)}">${text}<small>${sub}</small></button>`;
const video=(title,sub,cls)=>`<div class="video ${cls||''}" role="img" aria-label="Video placeholder: ${title}"><span class="play"></span>${cls?'':`<strong>${title}</strong><small>${sub}</small>`}</div>`;

/* derived */
function weekNo(){return Math.max(1,Math.floor((parse(TODAY)-parse(S.profile.start))/6048e5)+1);}
function phase(w){return w<=4?'Foundations':w<=8?'Build':w<=12?'Strong':'Keep strong';}
function weeksMap(){const m={};Object.keys(S.logs).forEach(d=>{if(S.logs[d].finished){const k=monday(parse(d));m[k]=(m[k]||0)+1;}});return m;}
function streak(){const m=weeksMap(),need=S.profile.sessions;let n=0,d=parse(monday(NOW));if((m[iso(d)]||0)<need)d=addDays(d,-7);while((m[iso(d)]||0)>=need){n++;d=addDays(d,-7);}return n;}
function badges(){const m=weeksMap(),tot=Object.values(m).reduce((a,b)=>a+b,0),fed=Object.values(S.logs).filter(l=>l.eaten==='yes'||(l.protein||0)>=3).length;
  return [['1','First session',tot>=1],['★','A full week',Object.values(m).some(v=>v>=S.profile.sessions)],['S','Strength score set',S.tests.length>=1],['10','Ten sessions',tot>=10],['P','Fuelled 5 days',fed>=5],['↑','Score improved',S.tests.length>=2&&S.tests[S.tests.length-1].n>S.tests[0].n]];}
const INSIGHT={jab:['Why today is easy','Many people find appetite is lowest in the days after their injection. Your hardest sessions sit at the other end of the week on purpose.'],easy:['Rest is part of the plan','Muscle repairs on rest days. Protein today matters as much as it does on a training day.'],strength:['Why strength, not cardio','When weight comes off quickly, some of it can be muscle. Asking your muscles to work two or three times a week tells your body to keep them.'],walk:['What walking is for','Walking helps your heart and helps keep weight off later. It supports your strength sessions, it does not replace them.']};
const LESSONS=[['Why muscle matters when you are losing weight','3 min'],['Protein made simple: the palm method','4 min'],['The rhythm of your injection week','3 min'],['Low appetite days: what to eat first','4 min'],['When the scales stall','3 min'],['Coming off the injections and staying strong','5 min']];
const GOALS={muscle:'keep your muscle',stronger:'feel stronger day to day',energy:'have more energy',confidence:'feel confident exercising'};

function weekStrip(){
  const p=S.profile, mon=parse(monday(NOW));
  let h='<div class="week" aria-label="This week">';
  for(let i=0;i<7;i++){const d=addDays(mon,i),pl=dayPlan(p,d.getDay()),l=S.logs[iso(d)];
    h+=`<div class="day ${pl.type}${iso(d)===TODAY?' today':''}${l&&l.finished?' done':''}"><b>${DAYS[d.getDay()]}</b><i></i><span>${pl.short}</span></div>`;}
  return h+'</div>';
}
function ring(done,need){const c=2*Math.PI*36,f=Math.min(1,done/need);
  return `<div class="ring" role="img" aria-label="${done} of ${need} sessions this week"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="9"/><circle cx="42" cy="42" r="36" fill="none" stroke="#FFC23C" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*f} ${c}"/></svg><b>${done}/${need}</b></div>`;}
const exNote=()=>S.profile.example?`<div class="note"><p class="small"><strong>You are looking at an example member, Sam, in week 3.</strong> Nothing here is saved.</p><button class="btn" data-act="start">Build my own plan</button></div>`:'';

function viewToday(){
  const p=S.profile, pl=dayPlan(p,NOW.getDay()), l=log(), drop=shouldDrop(l), strength=pl.type==='strength', w=weekNo();

    <fieldset><legend>Have you eaten enough today?</legend><div class="chips">${chip('eaten','yes',l.eaten,'Yes')}${chip('eaten','bit',l.eaten,'A bit')}${chip('eaten','no',l.eaten,'Hardly anything')}</div></fieldset>
    ${l.eaten==='no'?'<p class="small"><strong>Small and often works better than big meals.</strong> Try yoghurt, eggs, milk or a protein shake.</p>':''}

    <fieldset><legend>How is your energy?</legend><div class="chips">${[1,2,3,4,5].map(n=>chip('energy',n,l.energy,['Flat','Low','OK','Good','Great'][n-1])).join('')}</div></fieldset></div>

function viewSession(){

function viewProgress(){

  if(a==='next'){ if(step<STEPS-1){step++;go('setup');return;}
    const old=S.profile, keep=d.editing&&old;
    S.profile={name:d.name.trim(),goal:d.goal,jab:+d.jab,equip:d.equip,care:d.care,sessions:+d.sessions,len:+d.len,level:d.level,stage:keep&&old.level===d.level?old.stage:START[d.level],start:keep?old.start:TODAY};
    S.draft={}; save(); go('today'); return;}
  if(a==='reset'){ if(d.resetArmed){try{localStorage.removeItem(KEY);}catch(e){} S=blank();go('welcome');return;} d.resetArmed=true; render();return;}
  if(a==='test'){T={left:30,count:0,state:'idle'};go('test');return;}
  if(a==='exittest'){clearInterval(timer);go('today');return;}
  if(a==='timer'){T.state='run';T.left=30;render();timer=setInterval(()=>{T.left--;const c=document.getElementById('clock');if(c)c.textContent=T.left;if(T.left<=0){clearInterval(timer);T.state='count';T.count=10;if(view==='test')render();}},1000);return;}
  if(a==='cup'){T.count++;render();return;} if(a==='cdown'){T.count=Math.max(0,T.count-1);render();return;}
  if(a==='savetest'){S.tests.push({d:TODAY,n:T.count});save();go('progress');return;}
  if(a==='loadup'||a==='loaddown'){S.loads[val]=Math.max(0,(S.loads[val]||0)+(a==='loadup'?1:-1));save();render();return;}
  if(/^q\d$/.test(a)||a==='goal'||a==='level'||a==='pain') d[a]=val;
  else if(a==='jab'||a==='sessions'||a==='len') d[a]=+val;
  else if(a==='equip') d.equip=toggle(d.equip,val);
  else if(a==='care') d.care=toggle(d.care,val,'none');
  else { const l=log();
    if(a==='eaten'||a==='felt') l[a]=val;
    else if(a==='energy') l.energy=+val;
    else if(a==='protein') l.protein=(l.protein===+val)?+val-1:+val;
    else if(a==='light') l.light=true;
    else if(a==='unlight') l.light=false;
    else if(a==='begin'){save();go('session');return;}
    else if(a==='nextex'){l.pos=(l.pos||0)+1;save();go('session');return;}
    else if(a==='prev'){ if(!l.pos){go('today');return;} l.pos--;save();go('session');return;}
    else if(a==='finish'){l.finished=true;save();go('today');return;}
    else if(a==='apply'){S.profile.stage=+val;msg='Next week is set. See you at your next session.';}
  }
  save(); render();
});
document.addEventListener('input',e=>{ if(e.target.id==='name'){S.draft.name=e.target.value;const n=document.getElementById('nextbtn');if(n)n.disabled=!e.target.value.trim();} });
document.addEventListener('change',e=>{ if(e.target.dataset.act==='cleared'){S.draft.cleared=e.target.checked;render();} });
render();
</script>
